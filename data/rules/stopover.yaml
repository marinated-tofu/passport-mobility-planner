group: stopover
title: "Airline and airport stopover programs"
rules:
  # --------------------------------------------------------------- Turkey
  - id: tr-turkish-airlines-touristanbul
    country: TR
    benefit: stopover program
    stay: 6 to 24 hours layover
    purpose: free guided city tour during a connection at Istanbul Airport
    unlocked_by:
      - holds: ticket
        condition: Turkish Airlines ticket (number starting 235) with an international-to-international connection at Istanbul Airport, both flights on the same booking (PNR), layover between 6 and 24 hours
    nationality_excluded: []
    nationality_only: []
    age: ""
    notes: >-
      Free. Turkish Airlines runs four tour routes through Istanbul with set departure times. Book online
      with the PNR or sign up at the Hotel Desk on the Arrivals floor at least 30 minutes before the tour
      (allow about 45 minutes with passport control). The tour must end at least 1 hour 25 minutes before
      the next flight. Passengers arrange their own Turkish visa if needed. It cannot be used in the same
      layover as the Stopover hotel offer. Schedule updated 1 May 2026.
    source: https://www.turkishairlines.com/en-int/flights/fly-different/touristanbul/
    source_owner: Turkish Airlines
    checked: 2026-11-07
    confidence: verified

  - id: tr-turkish-airlines-stopover-hotel
    country: TR
    benefit: stopover program
    stay: layover of at least 20 hours, up to 7 days
    purpose: free hotel nights in Istanbul during a connection
    unlocked_by:
      - holds: ticket
        condition: Turkish Airlines international-to-international itinerary via Istanbul Airport starting in one of the eligible countries, with a layover of 20 hours or more; request at least 72 hours before the flight
    nationality_excluded: []
    nationality_only: []
    age: ""
    notes: >-
      Free hotel with breakfast. Economy passengers get 1 night in a 4-star hotel; Business passengers get
      2 nights in a 5-star or boutique hotel. Request it through the airline's booking channel or the
      country email listed on the page, at least 72 hours ahead. Only trips that start in the countries
      the page lists qualify, and it can be used once per journey (outbound or return). Visa costs are
      the passenger's. Subject to hotel availability.
    source: https://www.turkishairlines.com/en-int/flights/stopover/
    source_owner: Turkish Airlines
    checked: 2026-11-07
    confidence: verified

  # ---------------------------------------------------------------- Qatar
  - id: qa-qatar-airways-stopover
    country: QA
    benefit: stopover program
    stay: up to 4 nights; transit time 12 to 96 hours
    purpose: discounted hotel stopover in Doha
    unlocked_by:
      - holds: ticket
        condition: Qatar Airways ticket connecting through Doha with 12 to 96 hours of transit; package booked through Qatar Airways Holidays
    nationality_excluded: []
    nationality_only: []
    age: ""
    notes: >-
      Discounted, not free. Hotel packages in 4- and 5-star Doha hotels start from about USD 14 per person
      per night, for up to 4 nights. Booked with or after the flight through Qatar Airways Holidays.
      Detailed terms sit behind a collapsed link and were not read; Qatar entry rules apply separately.
    source: https://www.qatarairways.com/en-gb/offers/qatar-stopover.html
    source_owner: Qatar Airways
    checked: 2026-11-07
    confidence: partial

  # ------------------------------------------------- United Arab Emirates
  - id: ae-emirates-dubai-connect
    country: AE
    benefit: stopover program
    stay: connection of 6 to 26 hours
    purpose: free hotel, meals and transfers during a long connection in Dubai
    unlocked_by:
      - holds: ticket
        condition: single Emirates ticket (176 stock), both flights operated by Emirates (flydubai from Terminal 3 also counts) on the shortest available connection of 6 to 26 hours; minimum fare (base plus YQ) USD 450 one-way or USD 700 return, or USD 500 / USD 1000 for EK-FZ combinations
      - holds: passport
        condition: valid for at least 6 months, and able to get UAE entry (some nationalities are refused)
    nationality_excluded: []
    nationality_only: []
    age: "adults 18+; up to 2 children when travelling with an adult"
    notes: >-
      Free in all cabins: hotel room, meals and airport transfers in Dubai. Hotels include Copthorne, Le
      Meridien Airport and JW Marriott Marquis or similar. Passengers must clear UAE immigration
      themselves. Only applies when no shorter connection was available. Subject to availability and the
      full terms on the page.
    source: https://www.emirates.com/english/before-you-fly/dubai-international-airport/dubai-connect/terms-and-conditions/
    source_owner: Emirates
    checked: 2026-11-07
    confidence: verified

  - id: ae-etihad-abu-dhabi-stopover
    country: AE
    benefit: stopover program
    stay: 2 free nights
    purpose: free hotel stopover in Abu Dhabi or Al Ain
    unlocked_by:
      - holds: ticket
        condition: return Etihad Airways ticket connecting through Abu Dhabi (AUH); add the hotel using the booking reference
    nationality_excluded: []
    nationality_only: []
    age: ""
    notes: >-
      Free 2-night hotel stay in Abu Dhabi or Al Ain added to an Etihad return trip through AUH; a voucher
      is issued after adding it. A free Stopover Pass gives up to 15% off at attractions. Minimum stay,
      hotel list and full terms were not confirmed.
    source: https://www.etihad.com/en/abu-dhabi/stopover
    source_owner: Etihad Airways
    checked: 2026-11-07
    confidence: partial

  # -------------------------------------------------------------- Iceland
  - id: is-icelandair-stopover
    country: IS
    benefit: stopover program
    stay: 1 night up to 7 nights
    purpose: stopover in Iceland on a transatlantic trip at no extra airfare
    unlocked_by:
      - holds: ticket
        condition: Icelandair transatlantic ticket between North America and Europe with the stopover added at booking
    nationality_excluded: []
    nationality_only: []
    age: ""
    notes: >-
      No added airfare for the stop in Iceland, from one night to a week. Hotels and activities are paid
      separately. Schengen entry rules apply in Iceland.
    source: https://www.icelandair.com/flights/stopover/
    source_owner: Icelandair
    checked: 2026-11-07
    confidence: verified

  # ------------------------------------------------------------- Portugal
  - id: pt-tap-portugal-stopover
    country: PT
    benefit: stopover program
    stay: up to 10 days
    purpose: stop in Lisbon or Porto at no extra airfare
    unlocked_by:
      - holds: ticket
        condition: TAP ticket (one-way, return or multi-city) connecting via Lisbon or Porto; stopover option offered during booking when the route qualifies
    nationality_excluded: []
    nationality_only: []
    age: ""
    notes: >-
      No added airfare for a stop of up to 10 days in Lisbon or Porto, on the way out or back. Booking
      shows whether a route qualifies. Extras: 25% off one TAP domestic flight on listed routes and
      discounts of up to 50% at more than 150 partners. No minimum stay stated. Schengen entry rules apply.
    source: https://www.flytap.com/en-us/stopover
    source_owner: TAP Air Portugal
    checked: 2026-11-07
    confidence: verified

  # --------------------------------------------------------------- Panama
  - id: pa-copa-panama-stopover
    country: PA
    benefit: stopover program
    stay: 24 hours to 15 days
    purpose: stop in Panama at no extra airfare
    unlocked_by:
      - holds: ticket
        condition: new Copa Airlines booking connecting through Panama City, stopover added outbound or on return
    nationality_excluded: []
    nationality_only: []
    age: ""
    notes: >-
      No added airfare for a stop of 24 hours to 15 days in Panama. Only for new bookings. Includes free
      tourist medical insurance for the first 10 days, plus merchant discounts when showing the booking
      or voucher with ID. Run by Copa with Panama's tourism promotion body. Panama entry rules apply.
    source: https://panama-stopover.com/en
    source_owner: Copa Airlines and Promtur Panama
    checked: 2026-11-07
    confidence: verified

  # ------------------------------------------------------------ Singapore
  - id: sg-singapore-airlines-stopover
    country: SG
    benefit: stopover program
    purpose: discounted stopover in Singapore
    unlocked_by:
      - holds: ticket
        condition: Singapore Airlines multi-city or stopover booking transiting Changi, departing from Australia, Belgium, Denmark, France, Germany, India, Indonesia, Italy, mainland China, Netherlands, Spain, Switzerland, Turkey, United Kingdom or Vietnam
    nationality_excluded: []
    nationality_only: []
    age: ""
    notes: >-
      Discounted, not free. Booking a stop in Singapore through the multi-city or stopover option gives
      up to S$20 in Changi transit e-vouchers for trips starting in the listed countries, plus partner
      deals on hotels and attractions. Singapore entry rules apply.
    source: https://www.singaporeair.com/en_UK/sg/plan-travel/privileges/singapore-stopover/
    source_owner: Singapore Airlines
    checked: 2026-11-07
    confidence: verified

  - id: sg-changi-free-singapore-tour
    country: SG
    benefit: stopover program
    stay: layover of 5.5 to 24 hours; tour about 2.5 hours
    purpose: free guided city tour during a transit at Changi
    unlocked_by:
      - holds: ticket
        condition: transit or transfer at Changi Airport with a layover of 5.5 to 24 hours, bags checked through to the final destination
      - holds: passport
        condition: able to enter Singapore; nationalities that need a visa (for example India or Pakistan) must already hold one
    nationality_excluded: []
    nationality_only: []
    age: ""
    notes: >-
      Free guided tours of about 2.5 hours with four itineraries and set registration times. Passengers
      clear immigration once in and once out. Changi also sells paid transit tours for layovers of 6 hours
      or more.
    source: https://www.changiairport.com/en/experience/tours/free-singapore-tour.html
    source_owner: Changi Airport Group
    checked: 2026-11-07
    confidence: verified

  # --------------------------------------------------------------- Taiwan
  - id: tw-taoyuan-free-half-day-tour
    country: TW
    benefit: stopover program
    stay: layover of 7 to 24 hours
    purpose: free guided half-day tour during a transit at Taoyuan
    unlocked_by:
      - holds: ticket
        condition: transit at Taiwan Taoyuan International Airport with a layover of 7 to 24 hours; book online 5 to 90 days ahead or same day at the airport
      - holds: passport
        condition: visa-exempt for Taiwan or holding a valid ROC visa; nationals of IN, ID, MM, VN, KH and LA qualify with a valid Travel Authorization Certificate
    nationality_excluded: []
    nationality_only: []
    age: ""
    notes: >-
      Free guided tours run by Taiwan's tourism authority, one tour per stopover. A self-guided option
      gives free Airport MRT tickets to non-Taiwanese travellers entering for up to 24 hours.
    source: https://halfdaytour.taiwan.net.tw/
    source_owner: Tourism Administration, Ministry of Transportation and Communications (Taiwan)
    checked: 2026-11-07
    confidence: verified

  - id: tw-taoyuan-transit-voucher-ntd600
    country: TW
    benefit: stopover program
    stay: entry of up to 24 hours
    purpose: NT$600 spending voucher for transit passengers who enter Taiwan
    unlocked_by:
      - holds: ticket
        condition: transit through Taoyuan International Airport, entering Taiwan for up to 24 hours, with an onward boarding pass
      - holds: passport
        condition: non-Taiwanese passport
    nationality_excluded: [TW]
    nationality_only: []
    age: ""
    notes: >-
      Free NT$600 in vouchers for airport shops and restaurants. Register online first, then collect at the
      airport Tourist Service Center by showing the passport and onward boarding pass. Runs 1 Nov 2025 to
      31 Dec 2028 or until the budget is used up.
    source: https://halfdaytour.taiwan.net.tw/Details/91934b7661a2418a83e18b896ae57260
    source_owner: Tourism Administration, Ministry of Transportation and Communications (Taiwan)
    checked: 2026-11-07
    confidence: verified

  # --------------------------------------------------------- Saudi Arabia
  - id: sa-saudi-stopover-transit-visa
    country: SA
    benefit: stopover program
    stay: up to 96 hours; visa valid 3 months, single entry
    purpose: stopover in Saudi Arabia, including tourism and Umrah
    unlocked_by:
      - holds: ticket
        condition: flight booked with Saudia or flynas through Saudi Arabia; the stopover visa is requested during the booking
    nationality_excluded: []
    nationality_only: []
    age: ""
    notes: >-
      The visa itself has no fee, but there is an application charge of about USD 10.50 plus required
      medical insurance from about USD 3.45. It is issued through the airline booking, valid 3 months for
      one entry, with a stay of up to 96 hours. Umrah needs a Nusuk appointment. The page does not say
      whether the onward flight must go to a third country. A free hotel night reported elsewhere is not
      on this page and is not included. Page updated 16 Sep 2026.
    source: https://www.visitsaudi.com/en/campaigns/saudi-stopover
    source_owner: Saudi Tourism Authority
    checked: 2026-11-07
    confidence: partial

  # ------------------------------------------------------------- Ethiopia
  - id: et-ethiopian-addis-ababa-stopover
    country: ET
    benefit: stopover program
    stay: connection of 8 to 24 hours (usually 1 night)
    purpose: free hotel, meals and transfers during a long connection in Addis Ababa
    unlocked_by:
      - holds: ticket
        condition: single Ethiopian Airlines ticket with both flights operated by Ethiopian, connecting in Addis Ababa for 8 to 24 hours
    nationality_excluded: []
    nationality_only: []
    age: ""
    notes: >-
      Free hotel (usually one night), meals and airport transfers. The voucher is issued automatically at
      the origin station or at the transit desk in Addis Ababa. The airline helps arrange the transit visa
      where needed. A longer visa-free stopover of 24 hours to 7 days was announced but is not yet in
      force, so it is not included. Page reviewed August 2026.
    source: https://www.ethiopianairlines.com/services/services-at-the-airport/addis-ababa-stopovers
    source_owner: Ethiopian Airlines
    checked: 2026-11-07
    confidence: verified

  # ----------------------------------------------------------- Kazakhstan
  - id: kz-air-astana-stopover-holiday
    country: KZ
    benefit: stopover program
    stay: 1 night (connection of at least 10 hours)
    purpose: discounted hotel stopover in Astana or Almaty
    unlocked_by:
      - holds: ticket
        condition: Air Astana ticket connecting in Astana or Almaty with a connection of at least 10 hours; package booked online with the booking reference
    nationality_excluded: []
    nationality_only: []
    age: ""
    notes: >-
      Discounted, not free: USD 19 for one night with breakfast and airport transfers. Guided tours cost
      extra. Source is Air Astana's own press release on resuming the programme; it is undated and the
      main programme page was behind a bot check, so prices and extra-night rates were not confirmed for
      today.
    source: https://ir.airastana.com/en/about-us/company-news/air-astana-resumes-stopover-holiday-program/
    source_owner: Air Astana
    checked: 2026-11-07
    confidence: partial

  # ---------------------------------------------------------- South Korea
  - id: kr-incheon-airport-transit-tour
    country: KR
    benefit: stopover program
    stay: layover of 24 hours or less
    purpose: guided transit tour from Incheon Airport
    unlocked_by:
      - holds: ticket
        condition: transit at Incheon International Airport with a layover of 24 hours or less; reserve online or join first-come on the day; register at the 1st floor desk at least 30 minutes before with passport and both boarding passes
      - holds: passport
        condition: visa-exempt for Korea (K-ETA where required), or holding a visa or permanent residence for the US, Canada, Australia, New Zealand or one of 32 European countries, or otherwise eligible to enter in transit
    nationality_excluded: []
    nationality_only: []
    age: ""
    notes: >-
      Incheon Airport runs short guided tours for transit passengers. One tour per visit. The page does
      not state the price, so it is not marked as free.
    source: https://www.airport.kr/ap_en/1469/subview.do
    source_owner: Incheon International Airport Corporation
    checked: 2026-11-07
    confidence: partial
