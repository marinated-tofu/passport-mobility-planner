country: TH
title: Settling in Thailand
steps:
  - id: th-tm30-address-notification
    order: 1
    category: address-registration
    step: Make sure your place of stay is notified to Immigration (TM30)
    who: Foreigners staying at an address in Thailand
    deadline: ""
    fee: ""
    needs: []
    how: "Ask your landlord or accommodation provider to confirm that the notification of residence has been filed with the Immigration Bureau."
    notes: "The Immigration Bureau site refused automated access on 2026-11-07, so who files, the deadline and the documents could not be confirmed. Check with your local immigration office before relying on this step."
    source: https://www.immigration.go.th/en/
    source_owner: Immigration Bureau, Royal Thai Police
    checked: 2026-11-07
    confidence: partial
  - id: th-90-day-report
    order: 2
    category: residence-registration
    step: Report your address to Immigration every 90 days
    who: Foreigners staying in Thailand longer than 90 days
    deadline: ""
    fee: ""
    needs: []
    how: "File the notification of staying longer than 90 days with the Immigration Bureau, in person or through its online service."
    notes: "The official pages (thailand.go.th and immigration.go.th) refused automated access on 2026-11-07, so the filing window, documents and late-filing fine could not be confirmed. A 90-day report does not extend your permission to stay."
    source: https://www.thailand.go.th/event-detail/001-01-018
    source_owner: Government of Thailand (thailand.go.th) / Immigration Bureau
    checked: 2026-11-07
    confidence: partial
  - id: th-tax-number
    order: 3
    category: tax-number
    step: Apply for a Taxpayer Identification Number (TIN)
    who: Foreigners liable to personal income tax who do not have a personal identification number under civil registration
    deadline: "Within 60 days from the date you derive assessable income"
    fee: ""
    needs: [passport, application-form]
    how: "Submit form L.P. 10.1 with a copy of your passport or alien certificate at an Area Revenue Office or Area Revenue Branch Office. Individuals may use any office regardless of where they live."
    notes: "The Revenue Department page lists exemptions for foreigners who stay only briefly in Thailand within a tax year. No fee is mentioned."
    source: https://www.rd.go.th/english/21987.html
    source_owner: The Revenue Department, Ministry of Finance, Thailand
    checked: 2026-11-07
    confidence: verified
