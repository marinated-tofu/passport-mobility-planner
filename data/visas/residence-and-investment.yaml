  # ---------------------------------------------------------------- Gulf
  - id: ae-golden-visa-investor-public-investment
    country: AE
    document: residence-permit
    name: "Golden Visa (investor - public investment / company or deposit)"
    purpose: long-term residence through business or financial investment
    fee: "AED 1,100 residence permit fee + AED 10 Knowledge Dirham + AED 10 Innovation Dirham + AED 20 delivery; AED 500 extra if applying inside the country; issuance fee rises AED 100 for each year over two years"
    fee_usd: 310
    minimum_investment: "Company share of at least AED 2 million, or bank deposit of at least AED 2,000,000 frozen for at least 2 years, or partner in establishments paying at least AED 250,000 tax annually"
    minimum_investment_usd: 545000
    processing: "5 days"
    processing_days: 5
    validity: "10 years, extendable if the same conditions are met"
    stay: "No minimum stay stated; u.ae says Golden visa holders may stay outside the UAE longer than the usual 6-month limit"
    apply: "GDRFA Dubai smart services (website or app) or Amer service centres; ICP eServices for other emirates"
    eligibility: "Investor or partner in a UAE company, depositor, or tax-paying partner; must support self and family without government support"
    proof_of_funds: "Audited financial report from an accredited UAE auditor and company bank statement; for deposits, a bank certificate showing a 2-year freeze; for the tax route, a Federal Tax Authority letter"
    required_documents: [passport, business-registration, bank-statements, tax-return, other]
    nationality_only: []
    nationality_excluded: []
    notes: "GDRFA Dubai groups the company, deposit and tax routes under one investor service. The deposit cannot be withdrawn while the permit is valid."
    source: https://www.gdrfad.gov.ae/en/services/8ea80da4-f43e-11eb-0320-0050569629e8
    source_owner: General Directorate of Residency and Foreigners Affairs Dubai (GDRFA)
    checked: 2026-11-07
    confidence: verified
