  - id: dossier-long-stay-pt
    prompt: "I'm applying for Portugal's digital nomad visa from Dubai and I fly on 10 March 2027. Check my documents in Personal/Travel against what the visa asks for and tell me what's missing."
    world:
      research: &pt-remote-work  # eval stand-ins for the official page, not its real text
        visas:PT: |
          ### Residence visa for remote work (digital nomad) - pt-d8-remote-work

          - Document: residence visa
          - Required documents: passport valid at least 3 months after the planned stay; work contract or employer declaration of remote work; proof of tax residence; proof of means of subsistence; health insurance valid in Portugal covering the stay; criminal record certificate
          - Proof of funds: "average monthly income over the last three months of at least four times the national minimum wage (EUR 920 in 2026)"
          - Criminal record: "Criminal record certificate from the country of nationality and from any country where the applicant has lived for more than one year, not required under 16"
          - How to apply: at the Portuguese consulate for the applicant's country of legal residence, with proof that the residence status there lasts beyond the visa's expiry
          - Source: https://vistos.mne.gov.pt/en/national-visas/necessary-documentation/residency
          - Checked: 07 Nov 2026, verified
        settle:PT: |
          ### Residence visa for remote work (digital nomad) - pt-d8-remote-work

          - Criminal record: "Criminal record certificate from the country of nationality and from any country where the applicant has lived for more than one year, not required under 16"
          - Insurance: health insurance valid in Portugal covering the stay
          - Source: https://vistos.mne.gov.pt/en/national-visas/necessary-documentation/residency
          - Checked: 07 Nov 2026, verified
    must:
      - "(?i)police|criminal record"
      - "(?i)Philippines|Philippine|NBI"
      - "(?i)insurance"
    targets: [file-agent, document-agent]
    rubric:
      - The answer says a criminal record certificate from the Philippines (her country of nationality) is missing.
      - The answer says the UAE police clearance (issued 3 June 2026) is there but may be too old by the time she applies, or asks how recent it must be.
      - The answer flags the Daman health insurance as not fit for the visa, because it covers only the United Arab Emirates and ends on 31 January 2027, before she flies.
      - The answer uses the four-times-minimum-wage income rule (EUR 3,680 a month on average) from the excerpt when it compares her payslips, or says the income could not be compared, and never invents another amount.
      - The answer cites the official page address with its checked or fetched date.

