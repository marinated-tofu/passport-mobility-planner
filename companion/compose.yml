# Library companion for the passport-mobility-planner Skill.
# On the NAS, set two shared folders you will give the Skill, then start it:
#   UPDATES_DIR=/path/to/updates LIBRARY_DIR=/path/to/library docker compose -f companion/compose.yml up -d --build
# Nightly it checks official announcement pages and refreshes copies of every official page the Skill cites.
# The NAS indexes the library folder for the Skill; http://<nas>:8088 is a plain search page for the home network.
# Optional summaries: uncomment the ollama service and LLM_* lines. Without them each update is the page title
# plus the changed lines and its official link.
services:
  companion:
    build:
      context: ..
      dockerfile: companion/Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Qatar}
      RUN_AT: ${RUN_AT:-03:00}
      # LLM_BASE_URL: http://ollama:11434/v1
      # LLM_MODEL: qwen3:8b
    ports:
      - "8088:8088"
    volumes:
      - companion-state:/state
      - ${UPDATES_DIR:?set UPDATES_DIR to the NAS folder the Skill reads for updates}:/output
      - ${LIBRARY_DIR:?set LIBRARY_DIR to the NAS folder for the rules library}:/library
    mem_limit: 512m
    cpus: 1.0

  # Trip agent: live research for the Skill, price comparison, and the trip queue (http://<nas>:8089).
  # It fills forms in a browser you watch and drive at http://<nas>:6080/vnc.html; you log in, check, pay and
  # submit. It sends an email only when you press Send. Start it with:
  #   DOCS_DIR=/path/to/documents VNC_PASSWORD=... docker compose -f companion/compose.yml up -d --build agent
  agent:
    build:
      context: ..
      dockerfile: companion/Dockerfile.agent
    restart: unless-stopped
    profiles: [agent]
    environment:
      TZ: ${TZ:-Asia/Qatar}
      VNC_PASSWORD: ${VNC_PASSWORD:?set VNC_PASSWORD for the browser view}
      NOVNC_URL: ${NOVNC_URL:-http://localhost:6080/vnc.html}
      DOCS_DIR: /docs
      # SEARCH_URL: http://searxng:8080/search
      # LLM_BASE_URL: http://ollama:11434/v1
      # LLM_MODEL: qwen3:8b
      # SMTP_HOST: smtp.example.com
      # SMTP_PORT: "587"
      # SMTP_USER: you@example.com
      # SMTP_PASSWORD: app-password
      # SMTP_FROM: you@example.com
    ports:
      - "8089:8089"
      - "6080:6080"
    volumes:
      - agent-state:/state
      - ${DOCS_DIR:?set DOCS_DIR to the documents folder the Skill reads}:/docs
    shm_size: 1gb
    mem_limit: 2g
    cpus: 2.0

  # ollama:
  #   image: ollama/ollama:0.6.8
  #   restart: unless-stopped
  #   volumes:
  #     - ollama:/root/.ollama

volumes:
  companion-state:
  agent-state:
  # ollama:
